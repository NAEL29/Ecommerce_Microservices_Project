spring.application.name=config-server
server.port=8888


spring.config.import=optional:file:.env[.properties]
spring.cloud.config.server.git.uri=https://github.com/NAEL29/Ecommerce_Microservices_Project.git
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=60
spring.cloud.config.server.git.search-paths=config-repo
spring.cloud.config.server.git.default-label=main

spring.cloud.config.server.git.username=NAEL29
spring.cloud.config.server.git.password=${GIT_TOKEN}